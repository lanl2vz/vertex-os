[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "no-redzone=yes",
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
]
