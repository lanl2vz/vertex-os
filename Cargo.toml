[workspace]
members = [
    "crates/vertex-demo-services",
    "crates/vertex-ir",
    "crates/vertex-supervisor",
    "crates/vertexctl",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
vertex-ir = { path = "crates/vertex-ir" }
