[workspace]
members = [
    "crates/vertex-abi",
    "crates/vertex-ir",
    "crates/vertex-supervisor",
    "crates/vertexctl",
    "userland/echo-server",
    "userland/logd",
    "userland/netstack",
    "userland/operator-shell",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = { version = "1.8.3", default-features = false, features = ["pure"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
vertex-abi = { path = "crates/vertex-abi" }
vertex-ir = { path = "crates/vertex-ir" }
